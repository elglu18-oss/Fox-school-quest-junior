<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#173f5f">
  <meta name="description" content="A gentle listen, look and tap school adventure for children aged 5–6.">
  <title>Fox School Quest Junior</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23173f5f'/%3E%3Cpath d='M12 18 24 26 32 22l8 4 12-8-4 26c-5 9-11 14-16 14S21 53 16 44Z' fill='%23f47c3c'/%3E%3Cpath d='M18 42c8-2 10 2 14 8 4-6 6-10 14-8-3 8-8 12-14 12s-11-4-14-12Z' fill='white'/%3E%3Ccircle cx='25' cy='36' r='3' fill='%23173f5f'/%3E%3Ccircle cx='39' cy='36' r='3' fill='%23173f5f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=junior7">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-screen="home" aria-label="Go home">
        <img src="assets%20images%20fox/Fox-happy.jpg" alt="Happy fox mascot">
        <span>FOX SCHOOL QUEST <b>JUNIOR</b></span>
      </button>
      <div class="top-actions">
        <button class="icon-control" id="soundToggle" type="button" aria-pressed="true"><span aria-hidden="true">🔊</span><b>Sound</b></button>
        <button class="icon-control" id="musicToggle" type="button" aria-pressed="true"><span aria-hidden="true">♫</span><b>Music</b></button>
      </div>
    </header>
    <div class="layout">
      <aside class="sidebar" aria-label="Main menu">
        <nav>
          <button class="nav-item active" data-screen="home"><span aria-hidden="true">🏠</span><b>Home</b></button>
          <button class="nav-item" data-screen="listen"><span aria-hidden="true">👂</span><b>Listen &amp; Tap</b></button>
          <button class="nav-item" data-screen="colour"><span aria-hidden="true">🎨</span><b>Colour</b></button>
          <button class="nav-item" data-screen="match"><span aria-hidden="true">🃏</span><b>Match</b></button>
          <button class="nav-item" data-screen="count"><span aria-hidden="true">⭐</span><b>Count</b></button>
          <button class="nav-item" data-screen="math"><span aria-hidden="true">➕</span><b>Math Mission</b></button>
          <button class="nav-item" data-screen="missing"><span aria-hidden="true">❓</span><b>Missing</b></button>
        </nav>
        <button class="backpack-button" data-screen="backpack"><span aria-hidden="true">🎒</span><b>My Backpack</b></button>
      </aside>
      <main id="main" class="main" tabindex="-1"></main>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=junior7"></script>
</body>
</html>
